<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Archivo, system-ui, sans-serif"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
