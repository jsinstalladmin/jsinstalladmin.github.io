    <rect width="800" height="420" fill="#F2F0EC"/>
    <rect width="800" height="420" fill="url(#g)"/><text x="92" y="84" fill="rgba(22,18,13,.45)" font-size="15" font-weight="400" text-anchor="start" letter-spacing=".06em">BEFORE YOU PUT DOWN A DEPOSIT</text><rect x="92" y="113" width="21" height="21" rx="5" fill="none" stroke="#A8824C" stroke-width="1.6"/><path d="M97 123l4 4 7-8" fill="none" stroke="#A8824C" stroke-width="2" stroke-linecap="round"/><text x="128" y="130" fill="#16120D" font-size="17">Do you build it or subcontract?</text><path d="M92 148h616" stroke="rgba(22,18,13,.10)" stroke-width="1"/><rect x="92" y="157" width="21" height="21" rx="5" fill="none" stroke="#A8824C" stroke-width="1.6"/><path d="M97 167l4 4 7-8" fill="none" stroke="#A8824C" stroke-width="2" stroke-linecap="round"/><text x="128" y="174" fill="#16120D" font-size="17">Is the installer your employee?</text><path d="M92 192h616" stroke="rgba(22,18,13,.10)" stroke-width="1"/><rect x="92" y="201" width="21" height="21" rx="5" fill="none" stroke="#A8824C" stroke-width="1.6"/><path d="M97 211l4 4 7-8" fill="none" stroke="#A8824C" stroke-width="2" stroke-linecap="round"/><text x="128" y="218" fill="#16120D" font-size="17">What is the board, and the edge?</text><path d="M92 236h616" stroke="rgba(22,18,13,.10)" stroke-width="1"/><rect x="92" y="245" width="21" height="21" rx="5" fill="none" stroke="#A8824C" stroke-width="1.6"/><path d="M97 255l4 4 7-8" fill="none" stroke="#A8824C" stroke-width="2" stroke-linecap="round"/><text x="128" y="262" fill="#16120D" font-size="17">Who measures, and when?</text><path d="M92 280h616" stroke="rgba(22,18,13,.10)" stroke-width="1"/><rect x="92" y="289" width="21" height="21" rx="5" fill="none" stroke="#A8824C" stroke-width="1.6"/><path d="M97 299l4 4 7-8" fill="none" stroke="#A8824C" stroke-width="2" stroke-linecap="round"/><text x="128" y="306" fill="#16120D" font-size="17">What is the warranty?</text><path d="M92 324h616" stroke="rgba(22,18,13,.10)" stroke-width="1"/><text x="92" y="372" fill="rgba(22,18,