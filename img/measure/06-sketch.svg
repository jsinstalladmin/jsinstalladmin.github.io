<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Archivo, system-ui, sans-serif"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(22,18,13,.09)" stroke-width="1"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A8824C"/></marker></defs><rect width="900" height="560" fill="#F2F0EC"/><rect width="900" height="560" fill="url(#g)"/><text x="60" y="52" fill="rgba(22,18,13,.5)" font-size="14" font-weight="500" text-anchor="start" letter-spacing=".03em">WHAT TO SEND US</text><rect x="130" y="110" width="640" height="300" fill="#FBFAF7" stroke="#16120D" stroke-width="1.6"/><rect x="200" y="170" width="500" height="190" fill="none" stroke="#16120D" stroke-width="2"/><rect x="200" y="330" width="500" height="30" fill="rgba(22,18,13,.5)" opacity=".25"/><path d="M200 152H700" stroke="#A8824C" stroke-width="1.4"/><path d="M200 145v14M700 145v14" stroke="#A8824C" stroke-width="1.4"/><text x="450.0" y="141" fill="#A8824C" font-size="15" text-anchor="middle" letter-spacing=".04em">96 1/2 in  ·  96 3/8 in  ·  96 1/4 in</text><path d="M178 170V360" stroke="#A8824C" stroke-width="1.4"/><path d="M171 170h14M171 360h14" stroke="#A8824C" stroke-width="1.4"/><text x="166" y="265.0" fill="#A8824C" font-size="15" text-anchor="middle" letter-spacing=".04em" transform="rotate(-90 166 265.0)">94 in both ends</text><rect x="330" y="190" width="90" height="70" fill="#CBD8DE" stroke="#16120D" stroke-width="1.4"/><text x="375" y="182" fill="rgba(22,18,13,.5)" font-size="12" font-weight="400" text-anchor="middle" letter-spacing=".03em">window</text><path d="M200 282H330" stroke="#A8824C" stroke-width="1.4"/><path d="M200 275v14M330 275v14" stroke="#A8824C" stroke-width="1.4"/><text x="265.0" y="271" fill="#A8824C" font-size="12" text-anchor="middle" letter-spacing=".04em">38 in</text><text x="420" y="392" fill="rgba(22,18,13,.5)" font-size="13" font-weight="400" text-anchor="middle" letter-spacing=".03em">baseboard 4 1/2 in tall, 3/4 in thick</text><text x="60" y="462" fill="#16120D" font-size="16" font-weight="400" text-anchor="start" letter-spacing=".03em">A photograph of a sketch on paper is enough. It does not need to be neat.</text><text x="60" y="488" fill="rgba(22,18,13,.5)" font-size="15" font-weight="400" text-anchor="start" letter-spacing=".03em">Three widths, two heights, the depth, the baseboard, and anything on the wall.</text><text x="60" y="520" fill="#A8824C" font-size="15" font-weight="400" text-anchor="start" letter-spacing=".03em">Send it with the form and we will come back with a drawing and a price.</text></svg>