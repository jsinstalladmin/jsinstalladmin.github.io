<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Archivo, system-ui, sans-serif"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(22,18,13,.09)" stroke-width="1"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A8824C"/></marker></defs><rect width="900" height="560" fill="#F2F0EC"/><rect width="900" height="560" fill="url(#g)"/><text x="60" y="52" fill="rgba(22,18,13,.5)" font-size="14" font-weight="500" text-anchor="start" letter-spacing=".03em">STEP 3 — THE DEPTH, ON THE FLOOR</text><rect x="200" y="120" width="500" height="260" fill="none" stroke="#16120D" stroke-width="2"/><rect x="200" y="120" width="500" height="26" fill="#C7A077" opacity=".8"/><text x="450" y="112" fill="rgba(22,18,13,.5)" font-size="14" font-weight="400" text-anchor="middle" letter-spacing=".03em">back wall</text><path d="M200 380h500" stroke="#16120D" stroke-width="2" stroke-dasharray="8 6"/><text x="450" y="404" fill="rgba(22,18,13,.5)" font-size="14" font-weight="400" text-anchor="middle" letter-spacing=".03em">the opening, or the front of the room</text><path d="M168 120V380" stroke="#A8824C" stroke-width="1.4"/><path d="M161 120h14M161 380h14" stroke="#A8824C" stroke-width="1.4"/><text x="156" y="250.0" fill="#A8824C" font-size="15" text-anchor="middle" letter-spacing=".04em" transform="rotate(-90 156 250.0)">DEPTH, front to back</text><rect x="230" y="150" width="120" height="200" fill="#C7A077" opacity=".35" stroke="#A8824C" stroke-width="1.3"/><text x="290" y="258" fill="#A8824C" font-size="15" font-weight="400" text-anchor="middle" letter-spacing=".03em">24 in</text><text x="290" y="280" fill="rgba(22,18,13,.5)" font-size="13" font-weight="400" text-anchor="middle" letter-spacing=".03em">if it hangs</text><rect x="420" y="150" width="70" height="200" fill="#C7A077" opacity=".35" stroke="#A8824C" stroke-width="1.3"/><text x="455" y="258" fill="#A8824C" font-size="15" font-weight="400" text-anchor="middle" letter-spacing=".03em">14 in</text><text x="455" y="280" fill="rgba(22,18,13,.5)" font-size="13" font-weight="400" text-anchor="middle" letter-spacing=".03em">shelves only</text><text x="60" y="470" fill="#16120D" font-size="16" font-weight="400" text-anchor="start" letter-spacing=".03em">A hanger shoulder is 22 inches, so a hanging section needs 24 of depth.</text><text x="60" y="496" fill="rgba(22,18,13,.5)" font-size="15" font-weight="400" text-anchor="start" letter-spacing=".03em">Shelves alone want 14. Deeper than that and the back is unreachable.</text></svg>