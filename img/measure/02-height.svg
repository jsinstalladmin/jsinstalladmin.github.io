<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Archivo, system-ui, sans-serif"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(22,18,13,.09)" stroke-width="1"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A8824C"/></marker></defs><rect width="900" height="560" fill="#F2F0EC"/><rect width="900" height="560" fill="url(#g)"/><text x="60" y="52" fill="rgba(22,18,13,.5)" font-size="14" font-weight="500" text-anchor="start" letter-spacing=".03em">STEP 2 — THE HEIGHT, AT BOTH ENDS</text><rect x="200" y="100" width="500" height="340" fill="#E6E1D7" stroke="#16120D" stroke-width="2"/><rect x="200" y="410" width="500" height="30" fill="rgba(22,18,13,.5)" opacity=".3"/><path d="M200 100h500" stroke="#16120D" stroke-width="2"/><path d="M168 100V410" stroke="#A8824C" stroke-width="1.4"/><path d="M161 100h14M161 410h14" stroke="#A8824C" stroke-width="1.4"/><text x="156" y="255.0" fill="#A8824C" font-size="15" text-anchor="middle" letter-spacing=".04em" transform="rotate(-90 156 255.0)">left, floor to ceiling</text><path d="M735 100V410" stroke="#A8824C" stroke-width="1.4"/><path d="M728 100h14M728 410h14" stroke="#A8824C" stroke-width="1.4"/><text x="723" y="255.0" fill="#A8824C" font-size="15" text-anchor="middle" letter-spacing=".04em" transform="rotate(-90 723 255.0)">right, floor to ceiling</text><text x="450" y="270" fill="rgba(22,18,13,.5)" font-size="15" text-anchor="middle">measure to the CEILING,</text><text x="450" y="292" fill="rgba(22,18,13,.5)" font-size="15" text-anchor="middle">not to the top of the old shelf</text><text x="60" y="490" fill="#16120D" font-size="16" font-weight="400" text-anchor="start" letter-spacing=".03em">Floors slope. If the two differ, say so, and say which end is lower.</text><text x="60" y="516" fill="rgba(22,18,13,.5)" font-size="15" font-weight="400" text-anchor="start" letter-spacing=".03em">The top shelf lands at 84 inches off the floor, so the floor is what it follows.</text></svg>