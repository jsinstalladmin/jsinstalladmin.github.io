<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Archivo, system-ui, sans-serif"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(22,18,13,.09)" stroke-width="1"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A8824C"/></marker></defs><rect width="900" height="560" fill="#F2F0EC"/><rect width="900" height="560" fill="url(#g)"/><text x="60" y="52" fill="rgba(22,18,13,.5)" font-size="14" font-weight="500" text-anchor="start" letter-spacing=".03em">STEP 1 — THE WIDTH, MEASURED THREE TIMES</text><rect x="150" y="110" width="600" height="330" fill="#E6E1D7" stroke="#16120D" stroke-width="2"/><rect x="150" y="410" width="600" height="30" fill="rgba(22,18,13,.5)" opacity=".3"/><path d="M150 96H750" stroke="#A8824C" stroke-width="1.4"/><path d="M150 89v14M750 89v14" stroke="#A8824C" stroke-width="1.4"/><text x="450.0" y="85" fill="#A8824C" font-size="15" text-anchor="middle" letter-spacing=".04em">A  near the ceiling</text><path d="M150 262H742" stroke="#A8824C" stroke-width="1.4"/><path d="M150 255v14M742 255v14" stroke="#A8824C" stroke-width="1.4"/><text x="446.0" y="251" fill="#A8824C" font-size="15" text-anchor="middle" letter-spacing=".04em">B  at waist height</text><path d="M150 392H735" stroke="#A8824C" stroke-width="1.4"/><path d="M150 385v14M735 385v14" stroke="#A8824C" stroke-width="1.4"/><text x="442.5" y="381" fill="#A8824C" font-size="15" text-anchor="middle" letter-spacing=".04em">C  just above the baseboard</text><path d="M742 110v330M735 110v330" stroke="#B4553F" stroke-width="1" stroke-dasharray="4 4" opacity=".55"/><text x="60" y="490" fill="#16120D" font-size="16" font-weight="400" text-anchor="start" letter-spacing=".03em">Walls are not parallel. Write all three down and we build to the smallest.</text><text x="60" y="516" fill="rgba(22,18,13,.5)" font-size="15" font-weight="400" text-anchor="start" letter-spacing=".03em">A difference of half an inch over eight feet is normal and it matters.</text></svg>