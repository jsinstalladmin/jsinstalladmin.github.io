<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Archivo, system-ui, sans-serif"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(22,18,13,.09)" stroke-width="1"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A8824C"/></marker></defs><rect width="900" height="560" fill="#F2F0EC"/><rect width="900" height="560" fill="url(#g)"/><text x="60" y="52" fill="rgba(22,18,13,.5)" font-size="14" font-weight="500" text-anchor="start" letter-spacing=".03em">STEP 4 — THE BASEBOARD</text><rect x="230" y="110" width="440" height="230" fill="#E6E1D7" stroke="#16120D" stroke-width="2"/><rect x="230" y="340" width="440" height="52" fill="#DED7CA" stroke="#16120D" stroke-width="1.6"/><rect x="230" y="392" width="440" height="26" fill="rgba(22,18,13,.5)" opacity=".3"/><path d="M200 340V392" stroke="#A8824C" stroke-width="1.4"/><path d="M193 340h14M193 392h14" stroke="#A8824C" stroke-width="1.4"/><text x="188" y="366.0" fill="#A8824C" font-size="15" text-anchor="middle" letter-spacing=".04em" transform="rotate(-90 188 366.0)">how tall</text><path d="M670 340h58M670 392h58" stroke="rgba(22,18,13,.3)" stroke-width="1"/><path d="M670 440H700" stroke="#A8824C" stroke-width="1.4"/><path d="M670 433v14M700 433v14" stroke="#A8824C" stroke-width="1.4"/><text x="685.0" y="429" fill="#A8824C" font-size="15" text-anchor="middle" letter-spacing=".04em">how thick</text><path d="M700 300L700 436" stroke="rgba(22,18,13,.3)" stroke-width="1" stroke-dasharray="3 4"/><text x="60" y="480" fill="#16120D" font-size="16" font-weight="400" text-anchor="start" letter-spacing=".03em">A closet cannot sit flush to a wall that has a baseboard on it.</text><text x="60" y="506" fill="rgba(22,18,13,.5)" font-size="15" font-weight="400" text-anchor="start" letter-spacing=".03em">Either the baseboard comes off, or the run stands out by its thickness at both ends.</text></svg>